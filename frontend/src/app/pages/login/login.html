<div class="login-container">
  <div class="login-card">
    <div class="login-left">
      <!-- Decoration or branding could go here -->
      <div class="logo">
        <div class="logo-icon"></div>
        <h2>Inventory System</h2>
      </div>
      <p>Welcome back! Please login to your account.</p>
    </div>
    
    <div class="login-right">
      <h3>Login</h3>
      
      <div *ngIf="error" class="error-alert">{{ error }}</div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="input-field" formControlName="email" placeholder="Enter your email">
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="input-field" formControlName="password" placeholder="Enter your password">
        </div>
        
        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn-primary login-btn" [disabled]="loading || loginForm.invalid">
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>
    </div>
  </div>
</div>
