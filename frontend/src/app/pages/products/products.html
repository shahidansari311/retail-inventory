<div class="products-page">
  <div class="header">
    <h1>Products</h1>
    <button class="btn-primary" (click)="openAddForm()">+ Add Product</button>
  </div>

  <div *ngIf="error" class="error-alert">{{ error }}</div>

  <div *ngIf="loading" class="spinner-container">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!loading && products.length === 0" class="empty-state">
    <p>No products found. Add one to get started.</p>
  </div>

  <div class="table-container" *ngIf="!loading && products.length > 0">
    <table class="products-table">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.sku }}</td>
          <td>{{ product.name }}</td>
          <td class="desc-cell">{{ product.description }}</td>
          <td>${{ product.price | number:'1.2-2' }}</td>
          <td>{{ product.quantity }}</td>
          <td class="actions-cell">
            <button class="btn-icon edit" (click)="editProduct(product)" title="Edit">✎</button>
            <button class="btn-icon delete" (click)="deleteProduct(product.id)" title="Delete">🗑</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Side Panel Form -->
  <div class="panel-overlay" *ngIf="showForm" (click)="closeForm()"></div>
  <div class="side-panel" [class.open]="showForm">
    <div class="panel-header">
      <h2>{{ editingProduct ? 'Edit Product' : 'Add New Product' }}</h2>
      <button class="close-btn" (click)="closeForm()">&times;</button>
    </div>
    
    <div class="panel-content">
      <form (ngSubmit)="saveProduct()" #productForm="ngForm">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" [(ngModel)]="formData.name" name="name" required class="form-control" />
        </div>
        
        <div class="form-group">
          <label>SKU</label>
          <input type="text" [(ngModel)]="formData.sku" name="sku" required class="form-control" />
        </div>
        
        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="formData.description" name="description" rows="3" class="form-control"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group half">
            <label>Price</label>
            <input type="number" [(ngModel)]="formData.price" name="price" required min="0" step="0.01" class="form-control" />
          </div>
          <div class="form-group half">
            <label>Quantity</label>
            <input type="number" [(ngModel)]="formData.quantity" name="quantity" required min="0" class="form-control" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="closeForm()">Cancel</button>
          <button type="submit" class="btn-primary" [disabled]="!productForm.valid || loading">
            {{ loading ? 'Saving...' : 'Save Product' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
