<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <i class="fas fa-boxes"></i>
      <h2>RetailPro</h2>
    </div>
    
    <h3>Create Account</h3>
    <p class="subtitle">Sign up to manage your inventory</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input 
            type="text" 
            id="name" 
            formControlName="name" 
            placeholder="Enter your name">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Enter your email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Create a password">
        </div>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="btn btn-primary login-btn">
        <span *ngIf="!loading">Sign Up</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
      
      <p class="switch-link">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </form>
  </div>
</div>
